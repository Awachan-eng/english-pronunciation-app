<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語発音トレーニング</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <h1>英語発音トレーニング</h1>

        <p class="label">今日のフレーズ</p>

        <div class="phrase">
            I want to go to the park.
        </div>

        <button id="sampleButton">🔊 お手本を聞く</button>

        <button id="recordButton">🎤 録音開始</button>

        <button id="recognitionButton">🗣️ 英語を認識する</button>

        <p id="status">録音待機中</p>

        <audio id="audioPlayer" controls></audio>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
