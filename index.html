<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語発音トレーニング</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <h1>英語発音トレーニング</h1>

        <p class="label">今日のフレーズ</p>

        <div class="phrase" id="phrase">The rabbit runs around the lake.</div>

        <button id="phraseSampleButton">🔊 文全体のお手本を聞く</button>

        <p class="label">練習する単語を選んでください（1語ずつ認識します）</p>

        <div id="wordList" class="word-list"></div>

        <div id="currentInfo" class="current-info"></div>

        <button id="sampleButton">🔊 この単語のお手本を聞く</button>

        <button id="recordButton">🎤 この単語を認識</button>

        <div class="nav-row">
            <button id="prevButton">◀ 前の単語</button>
            <button id="nextButton">次の単語 ▶</button>
        </div>

        <button id="retryButton">🔄 最初からやり直す</button>

        <p id="status">認識待機中</p>

        <div id="totalScore" class="total-score"></div>

        <div id="result"></div>

        <div id="tips"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
