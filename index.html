<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語発音トレーニング</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <h1>英語発音トレーニング</h1>

        <p class="label">今日のフレーズ</p>

        <div class="phrase" id="phrase">The rabbit runs around the lake.</div>

        <button id="sampleButton">🔊 お手本を聞く</button>

        <button id="recordButton">🎤 認識を開始</button>

        <button id="retryButton">🔄 もう一度練習する</button>

        <p id="status">認識待機中</p>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
